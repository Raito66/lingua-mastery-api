spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingua_mastery
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8080

jwt:
  secret: lingua-mastery-secret-key-must-be-at-least-32-characters-long
  expiration-ms: 86400000
