databases:
  - name: lingua-mastery-db
    databaseName: lingua_mastery
    user: lingua_mastery_user
    plan: free

services:
  - type: web
    name: lingua-mastery-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: lingua-mastery-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lingua-mastery-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lingua-mastery-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lingua-mastery-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lingua-mastery-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://lingua-mastery-api.onrender.com
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
