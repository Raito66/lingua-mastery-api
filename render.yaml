databases:
  - name: lingua-mastery-db
    databaseName: lingua_mastery
    user: lingua_mastery_user
    plan: free

services:
  - type: web
    name: lingua-mastery-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: lingua-mastery-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lingua-mastery-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lingua-mastery-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lingua-mastery-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lingua-mastery-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://lingua-mastery-web.vercel.app
      - key: RESEND_API_KEY
        sync: false  # Resend API Key，從 resend.com 取得
      - key: MAIL_APP_FROM
        sync: false  # 信件顯示的寄件者，需使用 Resend 已驗證的網域，例如 LinguaMastery <noreply@yourdomain.com>
