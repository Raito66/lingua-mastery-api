databases:
  - name: lingua-mastery-db
    databaseName: lingua_mastery
    user: lingua_mastery_user
    plan: free

services:
  - type: web
    name: lingua-mastery-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: lingua-mastery-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lingua-mastery-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lingua-mastery-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lingua-mastery-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lingua-mastery-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://lingua-mastery-api.onrender.com
      - key: MAIL_APP_USERNAME
        sync: false  # 寄信用的 Gmail 帳號，例如 your@gmail.com
      - key: MAIL_APP_PASSWORD
        sync: false  # Gmail 應用程式密碼（App Password），非 Gmail 登入密碼
      - key: MAIL_APP_FROM
        sync: false  # 信件顯示的寄件者，例如 LinguaMastery <your@gmail.com>
